# proftpd.conf for vm1
# Mitigation: disable mod_copy SITE_CPFR and SITE_CPTO commands
# CVE-2015-3306

ServerName "vm1"
ServerType standalone
DefaultRoot ~

# Disable SITE_CPFR and SITE_CPTO if mod_copy is available
<IfModule mod_copy.c>
  <Limit SITE_CPFR SITE_CPTO>
    DenyAll
  </Limit>
</IfModule>

# Logging (basic)
TransferLog /var/log/proftpd/xferlog
SystemLog /var/log/proftpd/proftpd.log

# Use a reasonably secure umask
Umask 022 022
