version: '3'
services:
  db:
    image: mysql:5.7
    container_name: dev_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Str0ngR00tP@ss2026!
      MYSQL_DATABASE: dev_db
      MYSQL_USER: bluesniffer
      MYSQL_PASSWORD: qsaw
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - backend

  api:
    container_name: dev_api
    image: sample-express-app
    build: .
    restart: always
    environment:
      DB_HOST: db
    ports:
      - "3000:3000"
    networks:
      - backend
    depends_on:
      - db

networks:
  backend:
    driver: bridge
volumes:
  db_data:
